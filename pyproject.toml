[project]
name = "idb"
version = "0.2.0"
description = "Schema-on-read structured querying over heterogeneous documents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zhipeng Liang", email = "zhipeng.liang@unipd.it" }]
keywords = [
    "document-qa", "information-extraction", "retrieval-augmented-generation",
    "schema-on-read", "chinese-nlp", "ocr", "hybrid-search",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Database",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "lancedb>=0.6",
    "openai>=1.0",
    "anthropic>=0.30",
    "pymupdf>=1.23",
    "python-dotenv>=1.0",
    "pyarrow>=14.0",
    "sentence-transformers>=3.0",
    "pdf2image>=1.16",
    "pytesseract>=0.3",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0",
]

[project.scripts]
idb = "idb.cli:main"
idb-web = "idb.web.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
